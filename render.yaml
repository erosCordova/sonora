# Sonora: un único servidor Next.js con backend y páginas.
# La base sonora-db se creó previamente en Render Free; no duplicarla en databases:.
services:
  - type: web
    name: sonora-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/erosCordova/sonora
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sonora-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: WORKER_TOKEN
        generateValue: true
      - key: APP_URL
        value: https://sonora-tan-three.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: postgres
      - key: POSTGRES_AUDIO_MAX_BYTES
        value: "52428800"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: REQUIRE_ONLINE_WORKER
        value: "true"
