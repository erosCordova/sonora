name: Sonora CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web - calidad y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_TELEMETRY_DISABLED: '1'

  worker:
    name: Worker - pruebas de protocolo sin GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt av
      - name: Instalar FFmpeg para pruebas con MP3 real
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bash -n scripts/install-worker-rtx4050.sh scripts/start-worker-rtx4050.sh
      - run: node --check comfyui_bridge/web/sonora.js
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          WORKER_TOKEN: github-actions-token-de-prueba
          SONORA_REQUIRE_REAL_MP3: '1'

  integration:
    name: API + PostgreSQL - pruebas integrales
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonora_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonora_test
      STORAGE_BACKEND: postgres
      TEST_BASE_URL: http://127.0.0.1:3000
      APP_URL: http://localhost:3000
      APP_SECRET: github-actions-app-secret-de-prueba-no-publicar
      WORKER_TOKEN: github-actions-token-de-prueba
      COOKIE_SECURE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      SONORA_REQUIRE_REAL_MP3: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar FFmpeg para pruebas de almacenamiento MP3
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Preparar esquema de prueba
        run: npx drizzle-kit push
      - run: npm run build
      - name: Iniciar aplicación y comprobar salud
        run: |
          npm run start >/tmp/sonora-ci.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sonora-ci.log
          exit 1
      - name: Probar API, aislamiento de usuarios y cola
        run: npm run test:integration
