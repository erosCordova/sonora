name: Sonora CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web - calidad y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_TELEMETRY_DISABLED: '1'

  worker:
    name: Worker - pruebas de protocolo sin GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          WORKER_TOKEN: github-actions-token-de-prueba
